name: Dump macOS 27 Golden Gate Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/dump_macos_assets.yml'

jobs:
  extract:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Make scripts executable
        run: chmod +x tools/*.sh

      - name: Run Golden Gate asset extraction pipeline
        run: ./tools/extract_golden_gate.sh

      - name: Upload extracted assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-27-golden-gate-assets
          path: output_traffic_lights/
          if-no-files-found: warn
