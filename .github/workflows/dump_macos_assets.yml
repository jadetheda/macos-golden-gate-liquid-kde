name: Dump macOS Golden Gate Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/dump_macos_assets.yml'

jobs:
  extract:
    strategy:
      matrix:
        os: [macos-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Make scripts executable
        run: chmod +x tools/*.sh

      - name: Run Golden Gate traffic light capture & asset extraction
        run: ./tools/capture_runner.sh

      - name: Upload extracted assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-golden-gate-assets-${{ matrix.os }}
          path: output_traffic_lights/
          if-no-files-found: warn
